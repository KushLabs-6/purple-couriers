<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Staff Dashboard - Purple Couriers</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <nav class="navbar">
    <h1>Purple Couriers - Staff Portal</h1>
    <div class="navbar-links">
      <a href="/customer.html">Customer View</a>
      <a href="/staff.html">Dashboard</a>
    </div>
  </nav>

  <div class="container">
    <div class="dashboard-header" style="display: flex; justify-content: space-between; align-items: center;">
      <div>
        <h2>Today's Overview</h2>
        <p>System package accountability metrics.</p>
      </div>
    </div>

    <!-- Simplified stats for prototype -->
    <div class="stats-grid">
      <div class="stat-box"><div class="stat-number" id="total-count">0</div><div>Total Packages</div></div>
      <div class="stat-box"><div class="stat-number" id="received-count">0</div><div>Received</div></div>
      <div class="stat-box"><div class="stat-number" id="transit-count">0</div><div>In Transit</div></div>
      <div class="stat-box"><div class="stat-number" id="pickup-count">0</div><div>Ready for Pickup</div></div>
    </div>

    <div class="card">
      <h3>All Packages</h3>
      <div style="overflow-x: auto;">
        <table>
          <thead>
            <tr>
              <th>Package ID</th>
              <th>Customer</th>
              <th>Store</th>
              <th>Tracking</th>
              <th>Status</th>
              <th>Received</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody id="staff-table-body">
            <tr><td colspan="7">Loading data...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    // 1. Fetch data from the "Brain"
    async function loadStaffPackages() {
      const response = await fetch('/api/packages');
      const packages = await response.json();
      
      const tbody = document.getElementById('staff-table-body');
      tbody.innerHTML = '';
      
      // Update basic stats
      document.getElementById('total-count').innerText = packages.length;
      document.getElementById('received-count').innerText = packages.filter(p => p.status === 'Received').length;
      document.getElementById('transit-count').innerText = packages.filter(p => p.status === 'In Transit').length;
      document.getElementById('pickup-count').innerText = packages.filter(p => p.status === 'Ready for Pickup').length;

      // The status journey options
      const statuses = ['Pending Receipt', 'Received', 'Shipping', 'In Transit', 'Arrived in Jamaica', 'Ready for Pickup', 'Delivered'];

      packages.forEach(pkg => {
        const tr = document.createElement('tr');
        
        // Build the dropdown for updating status
        let statusOptions = statuses.map(s => 
          `<option value="${s}" ${pkg.status === s ? 'selected' : ''}>${s}</option>`
        ).join('');

        tr.innerHTML = `
          <td>${pkg.id}</td>
          <td>${pkg.customer}</td>
          <td>${pkg.store}</td>
          <td>${pkg.tracking}</td>
          <td><span class="status-badge" style="background-color: #f3f4f6; color: var(--primary);">${pkg.status}</span></td>
          <td>${pkg.receivedDate}</td>
          <td>
            <select onchange="updateStatus('${pkg.id}', this.value)" style="padding: 0.3rem; border-radius: 4px; border: 1px solid #ccc;">
              ${statusOptions}
            </select>
          </td>
        `;
        tbody.appendChild(tr);
      });
    }

    // 2. Send status update to the Brain
    async function updateStatus(packageId, newStatus) {
      await fetch(`/api/packages/${packageId}/status`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ status: newStatus })
      });
      loadStaffPackages(); // Reload table after update
    }

    // Run on startup
    loadStaffPackages();
  </script>
</body>
</html>
