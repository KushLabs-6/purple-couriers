<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Staff Login — It's Just Marketing and Shipping</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body { display: flex; flex-direction: column; min-height: 100vh; }
    .login-wrapper {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
      background: var(--bg-color);
    }
    .login-card {
      background: white;
      border-radius: 20px;
      padding: 3rem 2.5rem;
      max-width: 420px;
      width: 100%;
      border: 1px solid var(--border-color);
      box-shadow: 0 20px 60px rgba(0,0,0,0.08);
      text-align: center;
    }
    .login-icon { font-size: 3rem; margin-bottom: 1rem; }
    .login-card h2 { font-size: 1.6rem; font-weight: 700; margin-bottom: 0.3rem; }
    .login-card p { color: var(--text-muted); margin-bottom: 2rem; font-size: 0.95rem; }
    .login-card input {
      width: 100%;
      padding: 1rem 1.2rem;
      border-radius: 12px;
      border: 1px solid var(--border-color);
      font-size: 1rem;
      margin-bottom: 1rem;
      outline: none;
      transition: all 0.2s;
    }
    .login-card input:focus { border-color: var(--primary); box-shadow: 0 0 0 4px rgba(147,51,234,0.12); }
    .login-card .btn { width: 100%; padding: 1rem; font-size: 1rem; border-radius: 12px; }
    .error-msg { color: #b91c1c; font-size: 0.9rem; margin-top: 0.75rem; display: none; }
    footer { background: #000000; color: #64748b; text-align: center; padding: 1.5rem; font-size: 0.82rem; }
    footer img { height: 28px; vertical-align: middle; margin-left: 0.5rem; opacity: 0.7; }
  </style>
</head>
<body>
  <nav class="navbar">
    <h1>It's Just Marketing and Shipping</h1>
    <div class="navbar-links">
      <a href="/index.html">Home</a>
    </div>
  </nav>

  <div class="login-wrapper">
    <div class="login-card">
      <div class="login-icon">🔐</div>
      <h2>Staff Portal</h2>
      <p>Enter your staff password to access the business dashboard.</p>
      <form id="login-form">
        <input type="password" id="staffPassword" placeholder="Enter staff password" required autocomplete="current-password">
        <button type="submit" class="btn">Access Dashboard</button>
        <p class="error-msg" id="error-msg">❌ Incorrect password. Please try again.</p>
      </form>
    </div>
  </div>

  <footer>
    Website designed by 
    <a href="https://www.instagram.com/itsjusmarketing" target="_blank" rel="noopener noreferrer">
      <img src="/ijm-logo.png" alt="It's JUS Marketing">
    </a>
  </footer>

  <script>
    // If already authenticated, go straight to staff dashboard
    if (sessionStorage.getItem('pc_staff_auth') === 'true') {
      window.location.href = '/staff.html';
    }

    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const password = document.getElementById('staffPassword').value;
      const errMsg = document.getElementById('error-msg');
      errMsg.style.display = 'none';

      const res = await fetch('/api/staff/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ password })
      });

      if (res.ok) {
        sessionStorage.setItem('pc_staff_auth', 'true');
        window.location.href = '/staff.html';
      } else {
        errMsg.style.display = 'block';
        document.getElementById('staffPassword').value = '';
      }
    });
  </script>
</body>
</html>
