<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Customer Tracking - Purple Couriers</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <nav class="navbar">
    <h1>Purple Couriers</h1>
    <div class="navbar-links">
      <a href="/customer.html">Track Package</a>
      <a href="/staff.html">Staff View</a>
    </div>
  </nav>

  <div class="container">
    <div class="dashboard-header" style="text-align: center; margin-bottom: 3rem;">
      <h2>Track Your Package</h2>
      <p>Enter your Purple Couriers Package ID or your Store Tracking Number.</p>
      
      <form id="track-form" style="max-width: 500px; margin: 1.5rem auto; display: flex; gap: 0.5rem;">
        <input type="text" id="trackQuery" placeholder="e.g. PC-0045821 or 1Z123456" required style="flex: 1; padding: 1rem; font-size: 1.1rem; border-radius: 99px;">
        <button type="submit" class="btn" style="padding: 1rem 2rem; font-size: 1.1rem;">Search</button>
      </form>
    </div>

    <!-- Search Result Area -->
    <div id="search-result" style="max-width: 600px; margin: 0 auto; min-height: 150px;">
      <!-- Results inject here -->
    </div>

    <hr style="margin: 4rem 0; border: none; border-top: 1px solid var(--border-color);">

    <!-- Submit Receipt Form -->
    <div class="card receipt-card" style="max-width: 600px; margin: 0 auto;">
      <h3 style="margin-bottom: 0.5rem;">Submit New Receipt</h3>
      <p style="margin-bottom: 1.5rem; font-size: 0.95rem; color: var(--text-muted);">
        Did you just buy something? Upload your receipt so Customs and our couriers can process it quickly. Max size: 5MB.
      </p>
      
      <form id="add-package-form" style="display: flex; flex-direction: column; gap: 1rem;">
        <input type="text" id="storeName" name="store" placeholder="Online Store (e.g. Amazon)" required>
        <input type="text" id="trackingNum" name="tracking" placeholder="Store Tracking Number" required>
        
        <div style="background: white; padding: 1rem; border-radius: 12px; border: 1px solid var(--border-color);">
          <label style="font-weight: 600; font-size: 0.9rem; display: block; margin-bottom: 0.5rem;">Upload Receipt Image</label>
          <input type="file" id="receiptImage" name="receiptImage" accept="image/*" required style="border: none; background: transparent; padding: 0;">
        </div>

        <button type="submit" class="btn" id="submitBtn" style="margin-top: 0.5rem; padding: 1rem;">+ Upload & Submit Receipt</button>
      </form>
    </div>
  </div>

  <script>
    // 1. Handle Tracking Search
    document.getElementById('track-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const query = document.getElementById('trackQuery').value.trim();
      const resultDiv = document.getElementById('search-result');
      
      resultDiv.innerHTML = '<p style="text-align: center; color: var(--text-muted);">Searching...</p>';

      try {
        const res = await fetch(`/api/track/${encodeURIComponent(query)}`);
        if (!res.ok) throw new Error('Not found');
        const pkg = await res.json();
        
        let statusColor = 'var(--primary)';
        if(pkg.status === 'Ready for Pickup') statusColor = '#16a34a'; // Green
        if(pkg.status === 'Pending Receipt') statusColor = '#d97706'; // Orange

        resultDiv.innerHTML = `
          <div class="card" style="border-left: 4px solid ${statusColor}; animation: fadeIn 0.3s ease;">
            <div style="display: flex; justify-content: space-between; align-items: flex-start;">
              <h3>${pkg.store} Package</h3>
              <span class="status-badge" style="background: ${statusColor}22; color: ${statusColor};">${pkg.status}</span>
            </div>
            <p style="color: var(--text-muted); font-size: 0.9rem; margin-top: 0.5rem;">
              Tracking: <strong>${pkg.tracking}</strong> &nbsp;|&nbsp; ID: <strong>${pkg.id}</strong>
            </p>
            <div style="margin-top: 1.5rem; padding-top: 1.5rem; border-top: 1px solid var(--border-color);">
              <p><strong>Status Updated:</strong> ${pkg.receivedDate}</p>
              <p><strong>Current Step:</strong> ${pkg.step}</p>
            </div>
          </div>
        `;
      } catch (err) {
        resultDiv.innerHTML = `
          <div class="card" style="text-align: center; background: #fef2f2; border-color: #fca5a5;">
            <h3 style="color: #b91c1c;">Package Not Found</h3>
            <p style="color: #991b1b; font-size: 0.95rem;">We couldn't find a package with that ID or Tracking Number. Please check and try again.</p>
          </div>
        `;
      }
    });

    // 2. Handle Receipt Upload
    document.getElementById('add-package-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('submitBtn');
      btn.innerText = "Uploading...";
      btn.disabled = true;

      const formData = new FormData();
      formData.append('store', document.getElementById('storeName').value);
      formData.append('tracking', document.getElementById('trackingNum').value);
      formData.append('receiptImage', document.getElementById('receiptImage').files[0]);

      try {
        const res = await fetch('/api/packages', {
          method: 'POST',
          body: formData
        });
        
        if(res.ok) {
          const newPkg = await res.json();
          alert(`Success! Your Package ID is ${newPkg.id}. You can use this or your tracking number to check the status above.`);
          document.getElementById('add-package-form').reset();
        } else {
          alert('Error uploading receipt. Ensure it is an image under 5MB.');
        }
      } catch (err) {
        alert('Upload failed. Please try again.');
      }
      
      btn.innerText = "+ Upload & Submit Receipt";
      btn.disabled = false;
    });
  </script>
  
  <style>
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  </style>
</body>
</html>
