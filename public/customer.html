<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Customer Tracking - Purple Couriers</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <nav class="navbar">
    <h1>Purple Couriers</h1>
    <div class="navbar-links">
      <a href="/customer.html">Track Package</a>
      <a href="/staff.html">Staff View</a>
    </div>
  </nav>

  <div class="container">
    <div class="dashboard-header" style="text-align: center; margin-bottom: 3rem;">
      <h2>Track Your Package</h2>
      <p>Enter your Purple Couriers Package ID or your Store Tracking Number.</p>
      
      <form id="track-form" style="max-width: 500px; margin: 1.5rem auto; display: flex; gap: 0.5rem;">
        <input type="text" id="trackQuery" placeholder="e.g. PC-0045821 or 1Z123456" required style="flex: 1; padding: 1rem; font-size: 1.1rem; border-radius: 99px;">
        <button type="submit" class="btn" style="padding: 1rem 2rem; font-size: 1.1rem;">Search</button>
      </form>
    </div>

    <!-- Search Result Area -->
    <div id="search-result" style="max-width: 600px; margin: 0 auto; min-height: 150px;">
      <!-- Results inject here -->
    </div>

    <hr style="margin: 4rem 0; border: none; border-top: 1px solid var(--border-color);">

    <!-- Submit Receipt Form -->
    <div class="card receipt-card" style="max-width: 600px; margin: 0 auto;">
      <h3 style="margin-bottom: 0.5rem;">Submit New Receipt</h3>
      <p style="margin-bottom: 1.5rem; font-size: 0.95rem; color: var(--text-muted);">
        Did you just buy something? Upload your receipt so Customs and our couriers can process it quickly. Max size: 5MB.
      </p>
      
      <form id="add-package-form" style="display: flex; flex-direction: column; gap: 1rem;">
        <div style="display: flex; gap: 1rem; flex-wrap: wrap;">
          <input type="text" id="firstName" name="firstName" placeholder="First Name" required style="flex: 1; min-width: 140px;">
          <input type="text" id="lastName" name="lastName" placeholder="Last Name" required style="flex: 1; min-width: 140px;">
        </div>
        <input type="text" id="storeName" name="store" placeholder="Online Store (e.g. Amazon)" required>
        <input type="text" id="orderNum" name="order" placeholder="Order Number (Required for Amazon)">
        
        <div id="tracking-container" style="display: flex; flex-direction: column; gap: 0.5rem;">
          <input type="text" class="tracking-input" placeholder="Store Tracking Number" required>
        </div>
        <button type="button" id="add-tracking-btn" style="background: none; border: none; color: var(--primary); font-weight: 600; cursor: pointer; text-align: left; padding: 0.5rem 0; font-size: 0.9rem;">+ Add another tracking number</button>
        
        <div style="background: white; padding: 1rem; border-radius: 12px; border: 1px solid var(--border-color);">
          <label style="font-weight: 600; font-size: 0.9rem; display: block; margin-bottom: 0.5rem;">Upload Receipt Image (Optional)</label>
          <input type="file" id="receiptImage" name="receiptImage" accept="image/*" style="border: none; background: transparent; padding: 0;">
          
          <div style="margin-top: 1rem; padding-top: 1rem; border-top: 1px solid var(--border-color); display: flex; align-items: center; gap: 0.5rem;">
            <input type="checkbox" id="viaWhatsapp" style="min-width: auto; width: 1.2rem; height: 1.2rem; cursor: pointer;">
            <label for="viaWhatsapp" style="font-size: 0.9rem; cursor: pointer; color: var(--text-main);">I already sent my receipt via WhatsApp</label>
          </div>
        </div>

        <button type="submit" class="btn" id="submitBtn" style="margin-top: 0.5rem; padding: 1rem;">+ Upload & Submit Receipt</button>
      </form>
    </div>
  </div>

  <script>
    // 1. Handle Tracking Search
    document.getElementById('track-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const query = document.getElementById('trackQuery').value.trim();
      const resultDiv = document.getElementById('search-result');
      
      resultDiv.innerHTML = '<p style="text-align: center; color: var(--text-muted);">Searching...</p>';

      try {
        const res = await fetch(`/api/track/${encodeURIComponent(query)}`);
        if (!res.ok) throw new Error('Not found');
        const pkg = await res.json();
        
        let statusColor = 'var(--primary)';
        if(pkg.status === 'Ready for Pickup') statusColor = '#16a34a'; // Green
        if(pkg.status === 'Pending Receipt') statusColor = '#d97706'; // Orange

        resultDiv.innerHTML = `
          <div class="card" style="border-left: 4px solid ${statusColor}; animation: fadeIn 0.3s ease;">
            <div style="display: flex; justify-content: space-between; align-items: flex-start;">
              <h3>${pkg.store} Package</h3>
              <span class="status-badge" style="background: ${statusColor}22; color: ${statusColor};">${pkg.status === 'Received' ? `Received from ${pkg.store}` : pkg.status}</span>
            </div>
            <p style="color: var(--text-muted); font-size: 0.9rem; margin-top: 0.5rem;">
              Order: <strong>${pkg.order || 'N/A'}</strong> &nbsp;|&nbsp; Tracking: <strong>${pkg.tracking}</strong> &nbsp;|&nbsp; ID: <strong>${pkg.id}</strong>
            </p>
            <div style="margin-top: 1.5rem; padding-top: 1.5rem; border-top: 1px solid var(--border-color);">
              <p><strong>Status Updated:</strong> ${pkg.receivedDate}</p>
              <p><strong>Current Step:</strong> ${pkg.step}</p>
            </div>
          </div>
        `;
      } catch (err) {
        resultDiv.innerHTML = `
          <div class="card" style="text-align: center; background: #fef2f2; border-color: #fca5a5;">
            <h3 style="color: #b91c1c;">Package Not Found</h3>
            <p style="color: #991b1b; font-size: 0.95rem;">We couldn't find a package with that ID or Tracking Number. Please check and try again.</p>
          </div>
        `;
      }
    });

    // 2. Dynamically require Order Number if store is Amazon
    document.getElementById('storeName').addEventListener('input', function() {
      const orderField = document.getElementById('orderNum');
      const isAmazon = this.value.trim().toLowerCase() === 'amazon';
      orderField.required = isAmazon;
      orderField.placeholder = isAmazon
        ? 'Order Number (Required for Amazon e.g. 114-1234567-890)'
        : 'Order Number (Optional for this store)';
      orderField.style.borderColor = isAmazon ? 'var(--primary)' : '';
    });

    // 3. Handle Add Another Tracking Number button
    document.getElementById('add-tracking-btn').addEventListener('click', () => {
      const container = document.getElementById('tracking-container');
      const input = document.createElement('input');
      input.type = 'text';
      input.className = 'tracking-input';
      input.placeholder = 'Store Tracking Number';
      input.required = true;
      container.appendChild(input);
    });

    // 4. Handle Receipt Upload
    document.getElementById('add-package-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('submitBtn');
      btn.innerText = "Uploading...";
      btn.disabled = true;

      // Gather all tracking numbers
      const trackingInputs = document.querySelectorAll('.tracking-input');
      const trackings = Array.from(trackingInputs).map(input => input.value.trim()).filter(val => val !== '');

      const formData = new FormData();
      formData.append('firstName', document.getElementById('firstName').value.trim());
      formData.append('lastName', document.getElementById('lastName').value.trim());
      formData.append('store', document.getElementById('storeName').value);
      formData.append('order', document.getElementById('orderNum').value);
      formData.append('tracking', JSON.stringify(trackings));
      formData.append('viaWhatsapp', document.getElementById('viaWhatsapp').checked);
      
      const fileInput = document.getElementById('receiptImage');
      if (fileInput.files.length > 0) {
        formData.append('receiptImage', fileInput.files[0]);
      }

      try {
        const res = await fetch('/api/packages', {
          method: 'POST',
          body: formData
        });
        
        if(res.ok) {
          const newPackages = await res.json();
          const ids = newPackages.map(p => p.id).join(', ');
          alert(`Success! We created ${newPackages.length} package(s). Your Package IDs are: ${ids}. You can use these or your tracking numbers to check the status above.`);
          document.getElementById('add-package-form').reset();
          
          // Reset tracking container to just 1 input
          document.getElementById('tracking-container').innerHTML = '<input type="text" class="tracking-input" placeholder="Store Tracking Number" required>';
        } else {
          alert('Error uploading receipt. Ensure it is an image under 5MB.');
        }
      } catch (err) {
        alert('Upload failed. Please try again.');
      }
      
      btn.innerText = "+ Upload & Submit Receipt";
      btn.disabled = false;
    });
  </script>
  
  <style>
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  </style>
</body>
</html>
