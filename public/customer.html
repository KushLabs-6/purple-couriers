<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Customer Dashboard - Purple Couriers</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <nav class="navbar">
    <h1>Purple Couriers</h1>
    <div class="navbar-links">
      <a href="/customer.html">My Packages</a>
      <a href="/staff.html">Staff View</a>
    </div>
  </nav>

  <div class="container">
    <div class="dashboard-header">
      <h2>My Packages</h2>
      <p>Track your packages from the online store to your door.</p>
    </div>

    <!-- We will inject the packages here from the Brain (server) -->
    <div id="package-list">
      <p>Loading your packages...</p>
    </div>

    <div class="card receipt-card" style="margin-top: 2rem;">
      <h3>Submit New Receipt</h3>
      <p style="margin-bottom: 1rem; font-size: 0.9rem;">Did you just buy something? Let us know it's coming!</p>
      
      <form id="add-package-form" style="display: flex; flex-direction: column; gap: 1rem;">
        <input type="text" id="storeName" placeholder="Online Store (e.g. Amazon)" required style="padding: 0.5rem; border-radius: 4px; border: 1px solid #ccc;">
        <input type="text" id="trackingNum" placeholder="Tracking Number" required style="padding: 0.5rem; border-radius: 4px; border: 1px solid #ccc;">
        <button type="submit" class="btn">+ Submit Receipt</button>
      </form>
    </div>
  </div>

  <script>
    // 1. Fetch data from the "Brain" when the page loads
    async function loadPackages() {
      const response = await fetch('/api/packages');
      const packages = await response.json();
      
      const container = document.getElementById('package-list');
      container.innerHTML = ''; // Clear loading text
      
      packages.forEach(pkg => {
        let statusColor = 'var(--primary)';
        if(pkg.status === 'Ready for Pickup') statusColor = '#16a34a'; // Green
        if(pkg.status === 'Pending Receipt') statusColor = '#d97706'; // Orange

        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
          <h3>${pkg.store} Package</h3>
          <p style="color: #6b7280; font-size: 0.9rem;">Tracking: ${pkg.tracking} | ID: ${pkg.id}</p>
          <div class="package-status" style="color: ${statusColor}">
            <span style="margin-right: 0.5rem;">🟣</span>${pkg.status}
          </div>
          <p><strong>Received:</strong> ${pkg.receivedDate}</p>
          <p><strong>Next Step:</strong> ${pkg.step}</p>
        `;
        container.appendChild(card);
      });
    }

    // 2. Handle the "Submit Receipt" form to send data to the Brain
    document.getElementById('add-package-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const store = document.getElementById('storeName').value;
      const tracking = document.getElementById('trackingNum').value;
      
      // Send POST request to API
      await fetch('/api/packages', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ store, tracking })
      });

      // Clear form and reload list
      document.getElementById('storeName').value = '';
      document.getElementById('trackingNum').value = '';
      loadPackages();
      alert('Receipt submitted successfully!');
    });

    // Run on startup
    loadPackages();
  </script>
</body>
</html>
